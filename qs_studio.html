<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QS Studio</title>
<link rel="icon" type="image/png" sizes="256x256" href="assets/brand/favicon.png">
<link rel="shortcut icon" href="assets/brand/favicon.ico">
<script src="assets/js/mathjax-config.js?v=mathstruct3"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css?v=katex1">
<script src="assets/vendor/katex/katex.min.js?v=katex1"></script>
<link rel="stylesheet" href="assets/css/00-base.css?v=txtsize63">
<link rel="stylesheet" href="assets/css/01-themes.css?v=topicmeta1">
<link rel="stylesheet" href="assets/css/02-components.css?v=equationink1">
</head>
<body>

<div class="shell">

<!-- â•â•â• LEFT PANEL â•â•â• -->
<div class="panel-left">
  <div class="strip">
    <h2>Questions <span id="qcount" style="background:#e0dbd4;padding:1px 6px;border-radius:10px;font-size:10px">0</span></h2>
    <div class="strip-actions">
      <button class="btn" onclick="startFreshProject()">+ New</button>
      <button class="btn btn-open" onclick="openFromFile()">Open</button>
      <button class="btn pri btn-save-all" onclick="saveAll()">Save All</button>
    </div>
  </div>
  <div class="qs-list" id="qsList"></div>
  <div class="sidebar-footer">
    <button class="btn pri" style="width:100%;justify-content:center" onclick="newQ()">+ New Question</button>
  </div>
</div>

<!-- â•â•â• MID EDITOR â•â•â• -->
<div class="panel-mid">
  <div class="strip">
    <h2>Editor</h2>
    <button class="btn pri" onclick="saveQ()">&#128190; Save</button>
    <button class="btn" onclick="exportOnePNG()">&#128247; PNG</button>
    <button class="btn del" onclick="deleteQ()">&#10005; Delete</button>
  </div>
  <div class="editor" id="editor">
    <div class="empty"><div style="font-size:32px">&#128203;</div><div>Click <strong>+ New Question</strong> to start</div></div>
  </div>
</div>

<!-- â•â•â• RIGHT LIVE PAPER â•â•â• -->
<div class="panel-right">
  <div class="strip"><h2>Paper Preview</h2></div>
  <div class="paper-scroll" id="paperScroll">
    <div class="paper-sheet" id="paperSheet">
      <div class="paper-header">
        <div class="paper-title" id="paperTitle">Untitled Project</div>
        <div class="paper-meta" id="paperMeta">0 questions</div>
      </div>
      <div class="paper-section" id="paperBody"></div>
      <div class="paper-footer">
        <span id="pfLeft">No questions</span>
        <span>QS Studio</span>
      </div>
    </div>
  </div>
  <div class="right-strip">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="sec-lbl">Theme</div>
      <div class="theme-switch" id="themeSwitch">
        <button class="theme-btn active" type="button" data-theme="normal" onclick="setAppTheme('normal')">Normal</button>
        <button class="theme-btn" type="button" data-theme="dark" onclick="setAppTheme('dark')">Dark</button>
        <button class="theme-btn" type="button" data-theme="blue" onclick="setAppTheme('blue')">Dark Blue</button>
      </div>
      <div class="divider"></div>
      <div class="sec-lbl" style="display:none">Image Enhance</div>
      <div class="enh-panel" id="imgEnhPanel" style="display:none">
        <label class="enh-toggle"><input type="checkbox" id="imgEnhEnabled" checked onchange="toggleImageEnhance(this.checked)"> <span>Apply globally</span></label>
        <div class="enh-row">
          <span class="enh-name">Contrast</span>
          <input id="imgEnhContrast" type="range" min="80" max="145" step="1" value="112" oninput="setImageEnhanceValue('contrast', this.value)">
          <span class="enh-val" id="imgEnhContrastVal">112%</span>
        </div>
        <div class="enh-row">
          <span class="enh-name">Brightness</span>
          <input id="imgEnhBrightness" type="range" min="88" max="112" step="1" value="98" oninput="setImageEnhanceValue('brightness', this.value)">
          <span class="enh-val" id="imgEnhBrightnessVal">98%</span>
        </div>
        <div class="enh-row">
          <span class="enh-name">Saturate</span>
          <input id="imgEnhSaturate" type="range" min="70" max="120" step="1" value="90" oninput="setImageEnhanceValue('saturate', this.value)">
          <span class="enh-val" id="imgEnhSaturateVal">90%</span>
        </div>
        <div class="enh-presets">
          <button class="enh-preset" type="button" onclick="applyImageEnhancePreset('soft')">Soft</button>
          <button class="enh-preset" type="button" onclick="applyImageEnhancePreset('crisp')">Crisp</button>
          <button class="enh-preset" type="button" onclick="applyImageEnhancePreset('exam')">Exam Dark</button>
          <button class="enh-preset" type="button" onclick="applyImageEnhancePreset('ultra')">Ultra Crisp</button>
        </div>
        <div class="enh-actions">
          <button class="btn" type="button" onclick="resetImageEnhance()">Reset</button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="divider"></div>
      <div class="sec-lbl">PNG Frame</div>
      <div class="fpick">
        <div class="fp sel" onclick="setFrame('exam',this)">Paper (bordered)</div>
        <div class="fp" onclick="setFrame('minimal',this)">Minimal</div>
        <div class="fp" onclick="setFrame('dark',this)">Dark</div>
      </div>
      <div class="divider"></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn grn" onclick="runExportJob('Paper JSON', exportPaperJSON, {message:'Call registered. Building paper JSON...', working:'Rendering high-quality JSON assets...'})">&#8595; Paper JSON</button>
        <button class="btn grn" onclick="askWatermarkThen('bank')">&#8595; Paper PDF</button>
        <button class="btn grn" onclick="openQsSheetTemplatePipeline()">Page Layout PDF</button>
        <button class="btn" onclick="askWatermarkThen('selectable')">&#8595; Text PDF</button>
        <button class="btn" onclick="askWatermarkThen('selectable-clean')">&#8595; cleantheam</button>
        <button class="btn" onclick="runExportJob('Key JSON', exportAnsKeyJSON, {message:'Call registered. Building answer key JSON...', working:'Preparing answer key file...'})">&#128273; Key JSON</button>
        <button class="btn" onclick="askWatermarkThen('key')">&#128273; Key PDF</button>
      </div>
    </div>
  </div>
</div>

</div>

<div class="modal-backdrop hidden" id="appModal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="appModalTitle">Dialog</div>
        <div class="modal-sub" id="appModalSub"></div>
      </div>
      <button class="modal-close" type="button" id="appModalClose">&times;</button>
    </div>
    <div class="modal-body" id="appModalBody"></div>
  </div>
</div>

<!-- hidden rendering canvases -->
<canvas id="xcanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/js/00-constants.js"></script>
<script src="assets/js/01-state.js?v=selectablesync2"></script>
<script src="assets/js/02-sidebar.js?v=topiclist1"></script>
<script src="assets/js/03-editor.js?v=topiclist1"></script>
<script src="assets/js/04-canvas-engine.js?v=equationink1"></script>
<script src="assets/js/05-field-updaters.js?v=selectablesync2"></script>
<script src="assets/js/06-actions.js?v=topiclist1"></script>
<script src="assets/js/07-paper-preview.js?v=brandclean1"></script>
<script src="assets/js/08-export.js?v=katexselectable10"></script>
<script src="assets/js/09-helpers.js?v=cleanraster1"></script>
<script src="assets/js/11-persistence.js?v=topiclist1"></script>
<script src="assets/js/10-init.js?v=bootstrap1"></script>
<script src="assets/js/12-circuit-editor.js?v=customsymbols29"></script>
</body>
</html>
